# Dominios reales de los servicios ya publicados (18/09/2026). Los nombres de
# aqui abajo no coinciden con los del panel (alli son ecommerce_yeny,
# ecommerce_yeny-1 y ecommerce_yeny-2, con guion bajo), pero las URLs si son
# las buenas, que es lo que consume el codigo:
#
#   backend (node)   -> https://ecommerce-yeny.onrender.com
#   tienda (static)  -> https://ecommerce-yeny-1.onrender.com
#   panel  (static)  -> https://ecommerce-yeny-2.onrender.com
services:
  - type: web
    name: ecommerce-yeny-backend
    runtime: node
    plan: free
    rootDir: backend
    # El backend responde JSON en /: Render lo usa para dar el deploy por bueno.
    healthCheckPath: /
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MOCK_PAYMENT_MODE
        value: false
      # Dominios que pueden llamar al API. Sin esto el navegador bloquea a la
      # tienda y al panel por CORS.
      - key: CORS_ORIGINS
        value: https://ecommerce-yeny-1.onrender.com,https://ecommerce-yeny-2.onrender.com
      # A donde apunta el enlace de "recuperar contraseña" que va en el correo.
      # Es el dominio real de la tienda publicada, no el nombre del blueprint.
      - key: APP_URL
        value: https://ecommerce-yeny-1.onrender.com
      # Envío del correo de recuperación (Gmail: contraseña de aplicación,
      # no la del correo). Sin estas variables el enlace queda en el log.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false

  - type: static
    name: ecommerce-yeny-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # La tienda es una SPA: sin esta regla, entrar directo a /login o abrir el
    # enlace de /reset-password del correo responde 404.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://ecommerce-yeny.onrender.com/api
      # Enlace "Panel Admin" de la tienda.
      - key: VITE_ADMIN_URL
        value: https://ecommerce-yeny-2.onrender.com

  - type: static
    name: ecommerce-yeny-admin
    rootDir: administrador
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://ecommerce-yeny.onrender.com/api
      # Enlaces "Ir a la Tienda" del panel: dominio real de la tienda publicada.
      - key: VITE_STORE_URL
        value: https://ecommerce-yeny-1.onrender.com
